<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280">
  <defs>
    <radialGradient id="zone">
      <stop offset="0%" stop-color="#3a7d5a" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#1d4a38" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0f0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0b866" stop-opacity="0.95"/>
      <stop offset="46%" stop-color="#f0b866" stop-opacity="0.55"/>
      <stop offset="72%" stop-color="#7ddc8b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7ddc8b" stop-opacity="0.04"/>
    </linearGradient>
    <clipPath id="f"><rect width="880" height="280" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#f)">
    <rect width="880" height="280" fill="#080b0a"/>
    <circle cx="620" cy="140" r="250" fill="url(#zone)"/>

    <!-- sound, loud on the left, damped as it enters -->
    <g fill="none" stroke="url(#fade)">
      <path d="M60 140 q 22 -46 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0" stroke-width="2.6"/>
      <path d="M60 140 q 22 -78 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0" stroke-width="1.6" opacity="0.55"/>
      <path d="M60 140 q 22 -26 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0 t 44 0" stroke-width="1.4" opacity="0.5"/>
    </g>

    <!-- the boundary it crosses -->
    <circle cx="620" cy="140" r="182" fill="none" stroke="#f2707c" stroke-opacity="0.30" stroke-width="1.3" stroke-dasharray="7 6"/>
    <circle cx="620" cy="140" r="120" fill="none" stroke="#7ddc8b" stroke-opacity="0.55" stroke-width="1.6"/>

    <!-- centre: silence -->
    <circle cx="620" cy="140" r="60" fill="#0c1512" stroke="#7ddc8b" stroke-opacity="0.22"/>
    <line x1="596" y1="140" x2="644" y2="140" stroke="#7ddc8b" stroke-opacity="0.75" stroke-width="2.4" stroke-linecap="round"/>

    <!-- a faint horizon so it reads as a place -->
    <path d="M0 232 C 160 224, 300 238, 440 230 C 580 222, 720 238, 880 228 L880 280 L0 280 Z" fill="#0b100e"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="279" rx="10" fill="none" stroke="#22242b"/>
</svg>
