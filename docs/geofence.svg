<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#6b7688"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#7ddc8b"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#f2707c"/></marker>
  </defs>

  <rect width="880" height="470" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="469" rx="10" fill="none" stroke="#2b313d"/>

  <text x="28" y="38" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.3">TWO RADII, SO GPS JITTER CAN'T FLAP THE RINGER</text>

  <!-- ── geofence ── -->
  <g>
    <circle cx="200" cy="230" r="132" fill="#f2707c" fill-opacity="0.05" stroke="#f2707c" stroke-width="1.3" stroke-dasharray="6 4"/>
    <circle cx="200" cy="230" r="80" fill="#7ddc8b" fill-opacity="0.09" stroke="#7ddc8b" stroke-width="1.4"/>

    <!-- jitter path straddling the inner boundary -->
    <path d="M108 322 C 140 300, 150 268, 168 250 C 178 240, 172 226, 186 220 C 196 216, 190 232, 204 226 C 216 221, 210 208, 224 204"
          fill="none" stroke="#5fd0de" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.85"/>
    <circle cx="108" cy="322" r="3.2" fill="#5fd0de"/>
    <circle cx="224" cy="204" r="3.2" fill="#5fd0de"/>

    <circle cx="200" cy="230" r="5" fill="#f0b866"/>
    <text x="200" y="252" font-size="10" font-weight="700" fill="#f0b866" text-anchor="middle">college</text>

    <line x1="200" y1="230" x2="280" y2="230" stroke="#7ddc8b" stroke-width="1"/>
    <text x="240" y="223" font-size="9.5" fill="#7ddc8b" text-anchor="middle">150 m</text>

    <line x1="200" y1="230" x2="332" y2="230" stroke="#f2707c" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>
    <text x="306" y="248" font-size="9.5" fill="#f2707c" text-anchor="middle">250 m</text>

    <text x="200" y="386" font-size="10.5" font-weight="700" fill="#7ddc8b" text-anchor="middle">inside 150 m → college mode on</text>
    <text x="200" y="404" font-size="10.5" font-weight="700" fill="#f2707c" text-anchor="middle">past 250 m → normal mode back</text>
    <text x="200" y="424" font-size="10" fill="#8a9bb4" text-anchor="middle">between the two, nothing happens at all —</text>
    <text x="200" y="438" font-size="10" fill="#8a9bb4" text-anchor="middle">one radius would toggle on every GPS wobble</text>
  </g>

  <!-- divider -->
  <line x1="392" y1="56" x2="392" y2="446" stroke="#2b313d"/>

  <!-- ── the gates ── -->
  <text x="422" y="76" font-size="12" font-weight="700" fill="#8a9bb4" letter-spacing="1.1">WHAT EACH POLL CHECKS, IN ORDER</text>

  <g>
    <rect x="422" y="92" width="430" height="60" rx="8" fill="#12151b" stroke="#39414f" stroke-width="1.2"/>
    <text x="438" y="112" font-size="10.5" font-weight="700" fill="#e6edf3">1 · is it a college hour?</text>
    <text x="438" y="130" font-size="10" fill="#8a9bb4">outside 07:30–17:30 it sleeps without touching the GPS — the whole</text>
    <text x="438" y="144" font-size="10" fill="#8a9bb4">reason this doesn't eat your battery overnight</text>

    <rect x="422" y="160" width="430" height="60" rx="8" fill="#12151b" stroke="#5fd0de" stroke-width="1.2"/>
    <text x="438" y="180" font-size="10.5" font-weight="700" fill="#5fd0de">2 · where am I?</text>
    <text x="438" y="198" font-size="10" fill="#8a9bb4">network provider first, GPS only as fallback. Distance by haversine.</text>
    <text x="438" y="212" font-size="10" fill="#8a9bb4">An unreadable fix is logged and skipped, never guessed at.</text>

    <rect x="422" y="228" width="430" height="60" rx="8" fill="#12151b" stroke="#a78bfa" stroke-width="1.2"/>
    <text x="438" y="248" font-size="10.5" font-weight="700" fill="#a78bfa">3 · are headphones in?</text>
    <text x="438" y="266" font-size="10" fill="#8a9bb4">wired or Bluetooth — if so, no volume is touched in either direction.</text>
    <text x="438" y="280" font-size="10" fill="#8a9bb4">You plugged in on purpose; the script doesn't argue.</text>

    <rect x="422" y="296" width="430" height="72" rx="8" fill="#12151b" stroke="#f0b866" stroke-width="1.2"/>
    <text x="438" y="316" font-size="10.5" font-weight="700" fill="#f0b866">4 · did I override it by hand?</text>
    <text x="438" y="334" font-size="10" fill="#8a9bb4">Inside the fence, a media volume that doesn't match the target starts</text>
    <text x="438" y="347" font-size="10" fill="#8a9bb4">a 5-minute timer. Turn it back down yourself and the timer resets;</text>
    <text x="438" y="360" font-size="10" fill="#8a9bb4">leave it and college mode quietly reasserts itself.</text>
  </g>

  <rect x="422" y="376" width="430" height="56" rx="8" fill="#0f1319" stroke="#39414f" stroke-width="1.2"/>
  <text x="438" y="395" font-size="10.5" font-weight="700" fill="#e6edf3">what "college mode" sets</text>
  <g font-size="10" font-family="SFMono-Regular,Menlo,monospace" fill="#8a9bb4">
    <text x="438" y="412">media → 20% of max</text>
    <text x="620" y="412">ring → 0 (vibrate)</text>
    <text x="438" y="426">notification → 0</text>
    <text x="620" y="426">+ a toast, so you know</text>
  </g>

  <text x="852" y="452" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#5d6675" text-anchor="end">polls every 60s · bash + Termux:API · 251 lines</text>
</svg>
